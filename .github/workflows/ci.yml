name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check .
      - name: Tests including Streamlit and committed real-model corpus
        run: python -m pytest
      - name: Recompute audit metrics without LLM calls
        run: python -m lab05.audit
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-and-validation-results
          path: |
            data/out/
            results/
